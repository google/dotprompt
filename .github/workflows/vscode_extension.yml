name: "VS Code Extension"

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            packages/vscode/**
            .github/workflows/vscode_extension.yml

  build:
    needs: check-paths
    if: needs.check-paths.outputs.any_changed == 'true'
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install dependencies
        run: pnpm -C packages/vscode install

      - name: Build
        run: pnpm -C packages/vscode run build

      - name: Package
        run: pnpm -C packages/vscode run package

      - name: Upload Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dotprompt-vscode
          path: packages/vscode/*.vsix

  vscode-extension-all:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check overall status
        run: |
          if [[ "${NEEDS_BUILD_RESULT}" == "failure" ]]; then
            echo "VS Code extension checks failed"
            exit 1
          fi
          echo "VS Code extension checks passed or were skipped"
          exit 0
        env:
          NEEDS_BUILD_RESULT: ${{ needs.build.result }}
