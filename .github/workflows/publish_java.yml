name: Publish Java Package
#
# Requirements for this workflow:
#
# 1. Secrets must be configured in the repository settings:
#    - OSSRH_USERNAME: The username for Sonatype OSSRH (Maven Central).
#    - OSSRH_TOKEN: The password or token for Sonatype OSSRH.
#    - MAVEN_GPG_PRIVATE_KEY: The ASCII-armored GPG private key for signing artifacts.
#    - MAVEN_GPG_PASSPHRASE: The passphrase for the GPG private key.
#
# 2. GPG Key Formatting:
#    - The private key should be exported using: `gpg --armor --export-secret-keys <ID>`
#    - Ensure the key has no empty lines or formatting issues when pasted into GitHub Secrets.
#

permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  publish-java:
    runs-on: ubuntu-latest
    # Only run for releases tagged with dotprompt-java- prefix (per release-please config)
    if: startsWith(github.event.release.tag_name, 'dotprompt-java-')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # 0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # Always save cache for release builds
          cache-save: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          STEPS_IMPORT_GPG_OUTPUTS_KEYRING: ${{ steps.import_gpg.outputs.keyring }}
        run: |
          ./scripts/publish-java.sh \
            "${STEPS_IMPORT_GPG_OUTPUTS_KEYRING}" \
            "${{ secrets.MAVEN_GPG_PASSPHRASE }}" \
            "$MAVEN_USERNAME" \
            "$MAVEN_PASSWORD"
