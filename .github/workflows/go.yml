name: Go checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            go/**
            spec/**
            .github/workflows/go.yml

  go-mod-tidy-check:
    needs: check-paths
    if: needs.check-paths.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    name: go.sum Check
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Check go.mod and go.sum are tidy
        working-directory: go
        run: |
          go mod tidy
          if ! git diff --quiet go.sum go.mod; then
            echo "❌ go.mod or go.sum is not tidy. Run 'go mod tidy' in the go/ directory."
            git diff go.sum go.mod
            exit 1
          fi
          echo "✅ go.mod and go.sum are tidy"

  format-check:
    needs: check-paths
    if: needs.check-paths.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    name: Go Format Check
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Check formatting with gofmt
        run: |
          UNFORMATTED=$(gofmt -l go/)
          if [ -n "${UNFORMATTED}" ]; then
            echo "❌ The following Go files need formatting:"
            echo "${UNFORMATTED}"
            echo ""
            echo "Run 'gofmt -w go/' or 'scripts/format_go_files' to fix."
            exit 1
          fi
          echo "✅ All Go files are properly formatted."

  tests:
    runs-on: ubuntu-latest
    needs: [check-paths, format-check]
    if: needs.check-paths.outputs.any_changed == 'true'
    strategy:
      matrix:
        go-version: ["1.25.x", "1.26.x"]
      fail-fast: false

    name: Go ${{ matrix.go-version }} Tests
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install govulncheck
        # v1.7.0 is the last release that builds on Go 1.25 (v1.8.0+ require Go 1.26).
        # The vulnerability database is fetched at run time, so pinning doesn't age the scan.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Check build
        run: go build -C go -v ./...

      - name: Run tests
        run: go test -C go -v ./...

      - name: Run vulncheck
        run: govulncheck -C go ./...

  go-checks-all:
    if: always()
    needs: [go-mod-tidy-check, format-check, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check overall status
        run: |
          if [[ "${NEEDS_GO_MOD_TIDY_CHECK_RESULT}" == "failure" || "${NEEDS_FORMAT_CHECK_RESULT}" == "failure" || "${NEEDS_TESTS_RESULT}" == "failure" ]]; then
            echo "Go checks failed"
            exit 1
          fi
          echo "Go checks passed or were skipped"
          exit 0

        env:
          NEEDS_GO_MOD_TIDY_CHECK_RESULT: ${{ needs.go-mod-tidy-check.result }}

          NEEDS_FORMAT_CHECK_RESULT: ${{ needs.format-check.result }}

          NEEDS_TESTS_RESULT: ${{ needs.tests.result }}
