      - name: Run smoke test
        working-directory: ./python/handlebarrz/smoke_tests
        run: python -c "import handlebarrz; print('Import successful')"
  production_publish:
    name: Reconcile same smoke-qualified bytes to PyPI
    needs:
      - setup
      - prepare_candidate
      - testpypi_publish
      - smoke_test_linux_arm64
      - smoke_test_linux_x86_64
      - smoke_test_alpine_arm64
      - smoke_test_alpine_x86_64
      - smoke_test_macos_arm64
      - smoke_test_macos_x86_64
    if: |
      always() && !cancelled() &&
      needs.setup.result == 'success' &&
      needs.prepare_candidate.result == 'success' &&
      needs.testpypi_publish.result == 'success' &&
      needs.setup.outputs.publish_mode == 'production'
    runs-on: ubuntu-latest
    environment:
      name: pypi_github_publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Require all six smoke tests
        env:
          RESULT_LINUX_ARM64: ${{ needs.smoke_test_linux_arm64.result }}
          RESULT_LINUX_X86_64: ${{ needs.smoke_test_linux_x86_64.result }}
          RESULT_ALPINE_ARM64: ${{ needs.smoke_test_alpine_arm64.result }}
          RESULT_ALPINE_X86_64: ${{ needs.smoke_test_alpine_x86_64.result }}
          RESULT_MACOS_ARM64: ${{ needs.smoke_test_macos_arm64.result }}
          RESULT_MACOS_X86_64: ${{ needs.smoke_test_macos_x86_64.result }}
        run: |
          python -m pip install "packaging>=24.2"
          python python/handlebarrz/release_verifier.py gate \
            --result "linux_arm64=$RESULT_LINUX_ARM64" \
            --result "linux_x86_64=$RESULT_LINUX_X86_64" \
            --result "alpine_arm64=$RESULT_ALPINE_ARM64" \
            --result "alpine_x86_64=$RESULT_ALPINE_X86_64" \
            --result "macos_arm64=$RESULT_MACOS_ARM64" \
            --result "macos_x86_64=$RESULT_MACOS_X86_64"

      - name: Download retained current-run candidate
        uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: candidate/

      - name: Verify named tag still identifies pinned source
        env:
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
        run: |
          TAG_LINES=$(git ls-remote origin \
            "refs/tags/$RELEASE_TAG" \
            "refs/tags/$RELEASE_TAG^{}")
          TAG_SHA=$(printf '%s\n' "$TAG_LINES" | awk '/\^\{\}$/ {print $1}')
          if [[ -z "$TAG_SHA" ]]; then
            TAG_SHA=$(printf '%s\n' "$TAG_LINES" | awk 'NR == 1 {print $1}')
          fi
          [[ "$TAG_SHA" == "$SOURCE_SHA" ]]

      - name: Reconfirm TestPyPI still matches current-run bytes
        env:
          PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
        run: |
          python python/handlebarrz/release_verifier.py reconcile \
            --repository-url "https://test.pypi.org/legacy/" \
            --candidate candidate \
            --version "$PACKAGE_VERSION" \
            --require-complete

      - name: Reconcile PyPI and stage only missing wheels
        id: reconcile
        env:
          PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
        run: |
          python python/handlebarrz/release_verifier.py reconcile \
            --repository-url "https://upload.pypi.org/legacy/" \
            --candidate candidate \
            --upload-dir upload \
            --version "$PACKAGE_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record PyPI partial-upload recovery
        if: steps.reconcile.outputs.missing_count != '0'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PyPI uploads are per-file and can leave a temporary partial set.
          If upload or completeness validation fails, use **Re-run failed jobs**
          from **THIS run** so the retained candidate bytes are reused.
          Never start a fresh production run to recover a partial upload.
          EOF

      - name: Reverify read-only bytes immediately before PyPI upload
        if: steps.reconcile.outputs.missing_count != '0'
        env:
          PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
        run: |
          python python/handlebarrz/release_verifier.py verify-upload \
            --candidate candidate \
            --upload-dir upload \
            --version "$PACKAGE_VERSION"

      - name: Publish missing distribution files to PyPI
        if: steps.reconcile.outputs.missing_count != '0'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1.13
        with:
          verbose: true
          packages-dir: upload/
          repository-url: https://upload.pypi.org/legacy/

      - name: Record successful PyPI upload handoff
        if: steps.reconcile.outputs.missing_count != '0' && success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          The per-file upload returned success; exact registry digest validation follows.
          If that validation fails, use **Re-run failed jobs** from **THIS run**.
          Never start a fresh production run to recover a partial upload.
          EOF

      - name: Wait for PyPI propagation
        if: steps.reconcile.outputs.missing_count != '0'
        run: sleep 180

      - name: Require exact PyPI filename and digest set
        env:
          PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
        run: |
          python python/handlebarrz/release_verifier.py reconcile \
            --repository-url "https://upload.pypi.org/legacy/" \
            --candidate candidate \
            --version "$PACKAGE_VERSION" \
            --require-complete
