name: Publish dotpromptz-handlebars Package to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "The exact release tag of handlebarrz to publish"
        required: true
        type: string
      publish_mode:
        description: 'TestPyPI-only is for prerelease/dev versions; production continues to PyPI after smoke tests'
        type: choice
        options:
          - 'testpypi-only'
          - 'production'
        default: 'testpypi-only'
#  pull_request:
#    branches: [ main ]

# ==============================================================================
# PUBLISH PLATFORM CONTRACT
# ==============================================================================
# Every run builds and verifies this exact set. Diagnostic subsets belong in a
# separate build-only workflow and must never feed either registry path.
#   - Linux ARM64:   ENABLED  (native ubuntu-24.04-arm runner)
#   - Linux x86_64:  ENABLED  (native ubuntu-latest runner)
#   - Alpine ARM64:  ENABLED  (musl cross-compile on ARM64 runner)
#   - Alpine x86_64: ENABLED  (musl cross-compile on x86_64 runner)
#   - macOS ARM64:   ENABLED  (native macos-14 Apple Silicon runner)
#   - macOS x86_64:  ENABLED  (cross-compile on macos-14)
#   - Windows:       UNSUPPORTED
# ==============================================================================

jobs:
  # ===========================================================================
  # SETUP JOB - Validates the immutable release contract
  # ===========================================================================
  setup:
    name: Validate release contract
    runs-on: ubuntu-latest
    # Only run for handlebarrz releases or workflow_dispatch
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'dotpromptz-handlebars-'))
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      publish_mode: ${{ steps.mode.outputs.publish_mode }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Install release verifier dependency
        run: python -m pip install "packaging>=24.2"

      - name: Resolve publish mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.publish_mode }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PUBLISH_MODE="$INPUT_MODE"
          else
            PUBLISH_MODE="production"
          fi
          export PUBLISH_MODE
          python - <<'PY'
          import os
          import re
          from packaging.version import Version

          tag = os.environ['RELEASE_TAG']
          mode = os.environ['PUBLISH_MODE']
          if re.fullmatch(r'dotpromptz-handlebars-[0-9][0-9a-z.!+-]*', tag) is None:
              raise SystemExit('unsafe release tag')
          version = Version(tag.removeprefix('dotpromptz-handlebars-'))
          if str(version) != tag.removeprefix('dotpromptz-handlebars-'):
              raise SystemExit('non-canonical release version')
          if version.local is not None:
              raise SystemExit('local versions cannot be published')
          if mode not in {'production', 'testpypi-only'}:
              raise SystemExit('unsupported publish mode')
          if mode == 'testpypi-only' and not (version.is_prerelease or version.is_devrelease):
              raise SystemExit('TestPyPI-only mode requires a prerelease or dev version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish_mode={mode}\n')
              output.write(f'release_ref=refs/tags/{tag}\n')
          PY

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.mode.outputs.release_ref }}

      - name: Verify release versions
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.event.release.tag_name }}
          PUBLISH_MODE: ${{ steps.mode.outputs.publish_mode }}
        run: |
          python python/handlebarrz/release_verifier.py release \
            --tag-env RELEASE_TAG \
            --mode "$PUBLISH_MODE" \
            --cargo python/handlebarrz/Cargo.toml \
            --pyproject python/handlebarrz/pyproject.toml \
            --github-output "$GITHUB_OUTPUT"

      - name: Pin peeled source commit
        id: source
        run: |
          SOURCE_SHA=$(git rev-parse 'HEAD^{commit}')
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # BUILD JOBS
  # ===========================================================================

  build_ubuntu_arm64:
    name: Build for Ubuntu ARM64
    needs: [setup]
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner - no QEMU needed
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      matrix:
        python_version:
          - "3.10"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        env:
          RUSTUP_MAX_RETRIES: 3

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install maturin
        run: uv pip install --system "maturin[patchelf,zig]"

      - name: Build wheel
        working-directory: ./python/handlebarrz
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          maturin build \
            --release \
            --zig \
            --compatibility manylinux_2_24 \
            --auditwheel repair \
            -i python${{ matrix.python_version }} \
            -o dist

      - name: Upload build packages
        uses: actions/upload-artifact@v6
        with:
          name: wheels-ubuntu-arm64-${{ matrix.python_version }}
          path: python/handlebarrz/dist
          if-no-files-found: error

  build_alpine_arm64:
    name: Build for Alpine ARM64
    needs: [setup]
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner - cross-compile for musl
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      matrix:
        python_version:
          - "3.10"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
        env:
          RUSTUP_MAX_RETRIES: 3

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install maturin
        run: uv pip install --system "maturin[patchelf]"

      - name: Build wheels
        working-directory: ./python/handlebarrz
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          maturin build \
            --release \
            --target aarch64-unknown-linux-musl \
            --compatibility musllinux_1_2 \
            --auditwheel repair \
            -i python${{ matrix.python_version }} \
            -o dist

      - name: Upload build packages
        uses: actions/upload-artifact@v6
        with:
          name: wheels-alpine-arm64-${{ matrix.python_version }}
          path: python/handlebarrz/dist
          if-no-files-found: error

  build_alpine_x86_64:
    name: Build for Alpine x86_64
    needs: [setup]
    runs-on: ubuntu-latest  # Native x86_64 runner - cross-compile for musl
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      matrix:
        python_version:
          - "3.10"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
        env:
          RUSTUP_MAX_RETRIES: 3

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install maturin
        run: uv pip install --system "maturin[patchelf]"

      - name: Build wheels
        working-directory: ./python/handlebarrz
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          maturin build \
            --release \
            --target x86_64-unknown-linux-musl \
            --compatibility musllinux_1_2 \
            --auditwheel repair \
            -i python${{ matrix.python_version }} \
            -o dist

      - name: Upload build packages
        uses: actions/upload-artifact@v6
        with:
          name: wheels-alpine-x86_64-${{ matrix.python_version }}
          path: python/handlebarrz/dist
          if-no-files-found: error

  build_ubuntu_x86_64:
    name: Build for Ubuntu x86_64
    needs: [setup]
    runs-on: ubuntu-latest  # Native x86_64 runner
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      matrix:
        python_version:
          - "3.10"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        env:
          RUSTUP_MAX_RETRIES: 3

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install maturin
        run: uv pip install --system "maturin[patchelf,zig]"

      - name: Build wheel
        working-directory: ./python/handlebarrz
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          maturin build \
            --release \
            --zig \
            --compatibility manylinux_2_24 \
            --auditwheel repair \
            -i python${{ matrix.python_version }} \
            -o dist

      - name: Upload build packages
        uses: actions/upload-artifact@v6
        with:
          name: wheels-ubuntu-x86-64-${{ matrix.python_version }}
          path: python/handlebarrz/dist
          if-no-files-found: error

  build_macos_arm64:
    name: Build for macOS ARM64
    needs: [setup]
    runs-on: macos-14  # Apple Silicon
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      matrix:
        python_version:
          - "3.10"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Set up Node.js for Actions
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
        env:
          RUSTUP_MAX_RETRIES: 3

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install maturin
        run: pip install maturin

      - name: Clean Cargo Target Directory
        run: rm -rf target/
        working-directory: ./python/handlebarrz

      - name: Build wheel
        working-directory: ./python/handlebarrz
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: maturin build --release --strip -o dist

      - name: Upload build packages
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-arm64-${{ matrix.python_version }}-${{ github.job }}
          path: python/handlebarrz/dist
          if-no-files-found: error

  build_macos_x86_64:
    name: Build for macOS x86_64
    needs: [setup]
    runs-on: macos-14
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      matrix:
        python_version:
          - "3.10"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-apple-darwin
        env:
          RUSTUP_MAX_RETRIES: 3

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        working-directory: ./python/handlebarrz
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.12"
        run: maturin build --release --strip -o dist --target x86_64-apple-darwin

      - name: Upload build packages
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-x86_64-${{ matrix.python_version }}-${{ github.job }}
          path: python/handlebarrz/dist
          if-no-files-found: error

  # ===========================================================================
  # POISON-DETECTING, RESUMABLE EXACT-SIX PUBLICATION
  # ===========================================================================
  # Contract: poison-detecting, resumable exact-six publication.
  # Read-only upload copies catch accidental changes at the publisher seam.
  # The runner and commit-pinned publisher remain inside the trust boundary.

  prepare_candidate:
    name: Verify and retain exact wheel bytes
    needs: [setup, build_ubuntu_arm64, build_ubuntu_x86_64, build_alpine_arm64, build_alpine_x86_64, build_macos_arm64, build_macos_x86_64]
    if: always() && !cancelled() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: artifacts/
          merge-multiple: false

      - name: Verify build results and stage complete wheel set
        env:
          PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
          RESULT_LINUX_ARM64: ${{ needs.build_ubuntu_arm64.result }}
          RESULT_LINUX_X86_64: ${{ needs.build_ubuntu_x86_64.result }}
          RESULT_ALPINE_ARM64: ${{ needs.build_alpine_arm64.result }}
          RESULT_ALPINE_X86_64: ${{ needs.build_alpine_x86_64.result }}
          RESULT_MACOS_ARM64: ${{ needs.build_macos_arm64.result }}
          RESULT_MACOS_X86_64: ${{ needs.build_macos_x86_64.result }}
        run: |
          set -euo pipefail
          python -m pip install "packaging>=24.2"
          python python/handlebarrz/release_verifier.py gate \
            --result "linux_arm64=$RESULT_LINUX_ARM64" \
            --result "linux_x86_64=$RESULT_LINUX_X86_64" \
            --result "alpine_arm64=$RESULT_ALPINE_ARM64" \
            --result "alpine_x86_64=$RESULT_ALPINE_X86_64" \
            --result "macos_arm64=$RESULT_MACOS_ARM64" \
            --result "macos_x86_64=$RESULT_MACOS_X86_64"
          python python/handlebarrz/release_verifier.py stage \
            --artifacts artifacts \
            --candidate release-candidate \
            --version "$PACKAGE_VERSION"

      - name: Retain verified current-run candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate
          path: release-candidate/
          if-no-files-found: error

  testpypi_publish:
    name: Reconcile current-run wheels to TestPyPI
    needs: [setup, prepare_candidate]
    runs-on: ubuntu-latest
    environment:
      name: pypi_github_publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Download retained current-run candidate
        uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: candidate/

      - name: Reconcile TestPyPI and stage only missing wheels
        id: reconcile
        env:
          PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
        run: |
          python -m pip install "packaging>=24.2"
          python python/handlebarrz/release_verifier.py reconcile \
            --repository-url "https://test.pypi.org/legacy/" \
            --candidate candidate \
            --upload-dir upload \
            --version "$PACKAGE_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record TestPyPI partial-upload recovery
        if: steps.reconcile.outputs.missing_count != '0'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          TestPyPI uploads are per-file and can leave a temporary partial set.
          If upload or completeness validation fails, use **Re-run failed jobs**
          from **THIS run** so the retained candidate bytes are reused.
          Never start a fresh production run to recover a partial upload.
          EOF

      - name: Reverify read-only bytes immediately before TestPyPI upload
        if: steps.reconcile.outputs.missing_count != '0'
        env:
          PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
        run: |
          python python/handlebarrz/release_verifier.py verify-upload \
            --candidate candidate \
            --upload-dir upload \
            --version "$PACKAGE_VERSION"

      - name: Publish missing wheels to TestPyPI
        if: steps.reconcile.outputs.missing_count != '0'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1.13
        with:
          verbose: true
          packages-dir: upload/
          repository-url: https://test.pypi.org/legacy/

      - name: Record successful TestPyPI upload handoff
        if: steps.reconcile.outputs.missing_count != '0' && success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          The per-file upload returned success; exact registry digest validation follows.
          If that validation fails, use **Re-run failed jobs** from **THIS run**.
          Never start a fresh production run to recover a partial upload.
          EOF

      - name: Wait for TestPyPI propagation
        if: steps.reconcile.outputs.missing_count != '0'
        run: sleep 180

      - name: Require exact TestPyPI filename and digest set
        env:
          PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
        run: |
          python python/handlebarrz/release_verifier.py reconcile \
            --repository-url "https://test.pypi.org/legacy/" \
            --candidate candidate \
            --version "$PACKAGE_VERSION" \
            --require-complete

  # ===========================================================================
  # SMOKE TEST JOBS
  # ===========================================================================

  smoke_test_linux_arm64:
    name: Test for Linux ARM64
    needs: [setup, testpypi_publish]
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner - no QEMU needed
    strategy:
      matrix:
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        linux_platform:
          - "debian"
          - "fedora"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Download retained candidate manifest
        uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: python/handlebarrz/smoke_tests/candidate/

      - name: Add verifier to container context
        run: cp python/handlebarrz/release_verifier.py python/handlebarrz/smoke_tests/

      - name: Build container
        run: |
          cd python/handlebarrz/smoke_tests
          docker build \
          -t test-${{ matrix.linux_platform }}-arm64 \
          -f Dockerfile-${{ matrix.linux_platform }}-arm64 .

      - name: Run container
        run: |
          docker run test-${{ matrix.linux_platform }}-arm64:latest \
            sh ./execute-test.sh \
            "${{ matrix.python_version }}" \
            "https://test.pypi.org/simple" \
            "${{ needs.setup.outputs.package_version }}" \
            "linux_arm64"

  smoke_test_alpine_arm64:
    name: Test for Alpine ARM64
    needs: [setup, testpypi_publish]
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner - no QEMU needed
    strategy:
      matrix:
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Download retained candidate manifest
        uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: python/handlebarrz/smoke_tests/candidate/

      - name: Add verifier to container context
        run: cp python/handlebarrz/release_verifier.py python/handlebarrz/smoke_tests/

      - name: Build container
        run: |
          cd python/handlebarrz/smoke_tests
          docker build \
          -t test-alpine \
          -f Dockerfile-alpine .

      - name: Run container
        run: |
          docker run test-alpine:latest \
            sh ./execute-test.sh \
            "${{ matrix.python_version }}" \
            "https://test.pypi.org/simple" \
            "${{ needs.setup.outputs.package_version }}" \
            "alpine_arm64"

  smoke_test_alpine_x86_64:
    name: Test for Alpine x86_64
    needs: [setup, testpypi_publish]
    runs-on: ubuntu-latest  # Native x86_64 - no QEMU needed
    strategy:
      matrix:
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Download retained candidate manifest
        uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: python/handlebarrz/smoke_tests/candidate/

      - name: Add verifier to container context
        run: cp python/handlebarrz/release_verifier.py python/handlebarrz/smoke_tests/

      - name: Build container
        run: |
          cd python/handlebarrz/smoke_tests
          docker build \
          -t test-alpine-x86-64 \
          -f Dockerfile-alpine-x86-64 .

      - name: Run container
        run: |
          docker run test-alpine-x86-64:latest \
            sh ./execute-test.sh \
            "${{ matrix.python_version }}" \
            "https://test.pypi.org/simple" \
            "${{ needs.setup.outputs.package_version }}" \
            "alpine_x86_64"

  smoke_test_linux_x86_64:
    name: Test for Linux x86_64
    needs: [setup, testpypi_publish]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        linux_platform:
          - "debian"
          - "fedora"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Download retained candidate manifest
        uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: python/handlebarrz/smoke_tests/candidate/

      - name: Add verifier to container context
        run: cp python/handlebarrz/release_verifier.py python/handlebarrz/smoke_tests/

      - name: Build container
        run: |
          cd python/handlebarrz/smoke_tests
          docker build \
          -t test-${{ matrix.linux_platform }} \
          -f Dockerfile-${{ matrix.linux_platform }} .

      - name: Run container
        run: |
          docker run test-${{ matrix.linux_platform }}:latest \
            sh ./execute-test.sh \
            "${{ matrix.python_version }}" \
            "https://test.pypi.org/simple" \
            "${{ needs.setup.outputs.package_version }}" \
            "linux_x86_64"


  smoke_test_macos_arm64:
    name: Test for macOS ARM64
    needs: [setup, testpypi_publish]
    runs-on: macos-14
    env:
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: ""
      PIP_EXTRA_INDEX_URL: ""
      PIP_FIND_LINKS: ""
      PIP_NO_INDEX: ""
      UV_NO_CONFIG: "1"
      UV_INDEX: ""
      UV_INDEX_URL: ""
      UV_DEFAULT_INDEX: ""
      UV_EXTRA_INDEX_URL: ""
      UV_FIND_LINKS: ""
      UV_NO_INDEX: ""
    strategy:
      matrix:
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}

      - name: Download retained candidate manifest
        uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: candidate/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install runtime dependencies from production PyPI
        run: |
          python -m pip install \
            --isolated \
            --no-cache-dir \
            --index-url "https://pypi.org/simple" \
            --only-binary=:all: \
            "packaging>=24.2" \
            "structlog>=25.2.0"

      - name: Download and verify exact TestPyPI candidate
        run: |
          rm -rf smoke-download
          python -m pip download \
            --isolated \
            --no-cache-dir \
            --index-url "https://test.pypi.org/simple" \
            --only-binary=:all: \
            --no-deps \
            --dest smoke-download \
            "dotpromptz-handlebars==${{ needs.setup.outputs.package_version }}"
          wheels=(smoke-download/*.whl)
          [[ ${#wheels[@]} -eq 1 ]]
          python python/handlebarrz/release_verifier.py verify-smoke-wheel \
            --candidate candidate \
            --wheel "${wheels[0]}" \
            --target macos_arm64 \
            --version "${{ needs.setup.outputs.package_version }}"
          python -m pip install \
            --isolated \
            --no-cache-dir \
            --only-binary=:all: \
            --no-deps \
            "${wheels[0]}"

      - name: Run smoke test
        working-directory: ./python/handlebarrz/smoke_tests
        run: python -c "import handlebarrz; print('Import successful')"
  smoke_test_macos_x86_64:
