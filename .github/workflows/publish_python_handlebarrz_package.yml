# Publishes python/handlebars as dotpromptz-handlebars. The package is pure
# Python, so one py3-none-any wheel and one sdist cover every platform.
#
# PyPI trusted publishing is bound to this file name and the
# pypi_github_publishing environment. Keep both when editing.

name: Publish dotpromptz-handlebars Package to PyPI

permissions:
  contents: read

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "The exact release tag to publish, e.g. dotpromptz-handlebars-0.2.0"
        required: true
        type: string
      repository_url:
        description: 'The PyPI repository URL to publish to'
        type: choice
        options:
          - 'https://upload.pypi.org/legacy/'
          - 'https://test.pypi.org/legacy/'
        default: 'https://test.pypi.org/legacy/'

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'dotpromptz-handlebars-'))
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}
          persist-credentials: false

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          case "$TAG" in
            dotpromptz-handlebars-*) ;;
            *) echo "::error::Tag '$TAG' is not a dotpromptz-handlebars release tag."; exit 1 ;;
          esac
          echo "version=${TAG#dotpromptz-handlebars-}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Build
        working-directory: python
        run: uv build --package dotpromptz-handlebars --out-dir dist

      - name: Check the build matches the tag
        working-directory: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -l dist
          test -f "dist/dotpromptz_handlebars-${VERSION}-py3-none-any.whl" \
            || { echo "::error::Expected dotpromptz_handlebars-${VERSION}-py3-none-any.whl"; exit 1; }
          test -f "dist/dotpromptz_handlebars-${VERSION}.tar.gz" \
            || { echo "::error::Expected dotpromptz_handlebars-${VERSION}.tar.gz"; exit 1; }
          test "$(ls dist | wc -l)" -eq 2 \
            || { echo "::error::Expected exactly one wheel and one sdist"; exit 1; }

      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist-dotpromptz-handlebars
          path: python/dist/

  pypi_publish:
    name: Upload to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi_github_publishing
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-dotpromptz-handlebars
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1.13
        with:
          verbose: true
          packages-dir: dist/
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || inputs.repository_url || 'https://upload.pypi.org/legacy/' }}

  smoke_test:
    name: Install from the index on Python ${{ matrix.python_version }}
    needs: [build, pypi_publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install the published version
        env:
          VERSION: ${{ needs.build.outputs.version }}
          INDEX_URL: ${{ (github.event_name != 'release' && inputs.repository_url == 'https://test.pypi.org/legacy/') && 'https://test.pypi.org/simple/' || 'https://pypi.org/simple/' }}
        run: |
          # A new upload can take a few minutes to reach the index.
          for attempt in $(seq 1 20); do
            if python -m pip install --no-cache-dir --index-url "$INDEX_URL" "dotpromptz-handlebars==${VERSION}"; then
              exit 0
            fi
            echo "dotpromptz-handlebars ${VERSION} not installable yet (attempt ${attempt}/20)"
            sleep 30
          done
          echo "::error::dotpromptz-handlebars ${VERSION} never became installable from ${INDEX_URL}"
          exit 1

      - name: Import and render
        run: |
          python - <<'PY'
          from dotpromptz_handlebars import Handlebars

          out = Handlebars().compile('Hello {{name}}!')({'name': 'World'})
          assert out == 'Hello World!', out
          print(out)
          PY
