      PIP_EXTRA_INDEX_URL: ""
      PIP_FIND_LINKS: ""
      PIP_NO_INDEX: ""
      UV_NO_CONFIG: "1"
      UV_INDEX: ""
      UV_INDEX_URL: ""
      UV_DEFAULT_INDEX: ""
      UV_EXTRA_INDEX_URL: ""
