      - name: Download retained candidate manifest
        uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: candidate/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          architecture: x64

      - name: Install runtime dependencies from production PyPI
        run: |
          python -m pip install \
            --isolated \
            --no-cache-dir \
            --index-url "https://pypi.org/simple" \
            --only-binary=:all: \
            "packaging>=24.2" \
            "structlog>=25.2.0"

      - name: Download and verify exact TestPyPI candidate
        run: |
          rm -rf smoke-download
          python -m pip download \
            --isolated \
            --no-cache-dir \
            --index-url "https://test.pypi.org/simple" \
            --only-binary=:all: \
            --no-deps \
            --dest smoke-download \
            "dotpromptz-handlebars==${{ needs.setup.outputs.package_version }}"
          wheels=(smoke-download/*.whl)
          [[ ${#wheels[@]} -eq 1 ]]
          python python/handlebarrz/release_verifier.py verify-smoke-wheel \
            --candidate candidate \
            --wheel "${wheels[0]}" \
            --target macos_x86_64 \
            --version "${{ needs.setup.outputs.package_version }}"
          python -m pip install \
            --isolated \
