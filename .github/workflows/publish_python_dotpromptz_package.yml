name: Publish dotpromptz Package to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "The exact release tag of dotpromptz to publish"
        required: true
        type: string
      repository_url:
        description: "The PyPI repository URL to publish to"
        type: choice
        options:
          - 'https://upload.pypi.org/legacy/'
          - 'https://test.pypi.org/legacy/'
        default: 'https://test.pypi.org/legacy/'

permissions:
  contents: read

jobs:
  check_and_build:
    name: Dependency Check and Build
    runs-on: ubuntu-latest
    # Triggers on GitHub releases for the 'dotpromptz' package (tag: dotpromptz-X.Y.Z)
    # Excludes 'dotpromptz-handlebars' releases which have their own publish workflow
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'dotpromptz-') && !startsWith(github.event.release.tag_name, 'dotpromptz-handlebars-'))
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}
          persist-credentials: false

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          case "$TAG" in
            dotpromptz-*) ;;
            *) echo "::error::Tag '$TAG' is not a dotpromptz release tag."; exit 1 ;;
          esac
          echo "version=${TAG#dotpromptz-}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Preflight floor check: Replaces the legacy unpinned handlebarrz existence check.
      #
      # dotpromptz depends on dotpromptz-handlebars>=X.Y.Z (configured in pyproject.toml).
      # Because PyPI releases are immutable and downstream pip installs resolve
      # dependencies immediately, publishing dotpromptz before its required floor version
      # is live on PyPI leaves dotpromptz in a broken, uninstallable state.
      #
      # Rather than checking unversioned package existence with `requests`, this step:
      # 1. Dynamically reads the dependency floor from pyproject.toml via stdlib `tomllib`.
      # 2. Queries PyPI's per-version JSON endpoint via stdlib `urllib` to ensure the exact
      #    minimum required release is available before building or uploading.
      - name: Check dotpromptz-handlebars floor is on PyPI
        run: |
          python - <<'EOF'
          import re
          import sys
          import tomllib
          import urllib.error
          import urllib.request

          # 1. Extract the minimum required version of dotpromptz-handlebars
          with open('python/dotpromptz/pyproject.toml', 'rb') as f:
              deps = tomllib.load(f)['project']['dependencies']
          spec = next((d for d in deps if d.startswith('dotpromptz-handlebars')), None)
          m = re.fullmatch(r'dotpromptz-handlebars\s*>=\s*([0-9][0-9A-Za-z.]*)', spec or '')
          if not m:
              print(f'::error::Expected dotpromptz-handlebars>=X.Y.Z, got {spec!r}.')
              sys.exit(1)
          floor = m.group(1)

          # 2. Verify that this exact floor version exists and is live on PyPI
          url = f'https://pypi.org/pypi/dotpromptz-handlebars/{floor}/json'
          try:
              urllib.request.urlopen(url, timeout=30)
          except urllib.error.HTTPError as e:
              print(f'::error::dotpromptz-handlebars {floor} not on PyPI ({e.code}). Release it first.')
              sys.exit(1)
          print(f'dotpromptz-handlebars {floor} is on PyPI.')
          EOF

      # BUILD dotpromptz (only if the dependency check passed)
      - name: Set up uv and Create VENV
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          activate-environment: true
          python-version: "3.12"
          enable-cache: false

      - name: Install Build Tools
        run: |
          uv pip install build twine

      - name: Build dotpromptz Distributions
        run: |
          source .venv/bin/activate
          cd python/dotpromptz
          python -m build
          twine check dist/*

      - name: Upload dotpromptz Distributions for Python
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist-dotpromptz
          path: python/dotpromptz/dist/

  pypi_publish:
    name: Upload to PyPI
    needs: [check_and_build]
    runs-on: ubuntu-latest
    environment:
      name: pypi_github_publishing
    permissions:
      id-token: write

    steps:
      - name: Checkout code at tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-dotpromptz
          path: dist/

      - name: Publish Distribution to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1.13
        with:
          verbose: true
          packages-dir: dist/
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || inputs.repository_url || 'https://upload.pypi.org/legacy/' }}

  smoke_test_pypi_package:
    name: Verify Package Usability on Python ${{ matrix.python-version }}
    needs: [check_and_build, pypi_publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dotpromptz from PyPI
        env:
          VERSION: ${{ needs.check_and_build.outputs.version }}
          INDEX_URL: ${{ (github.event_name != 'release' && inputs.repository_url == 'https://test.pypi.org/legacy/') && 'https://test.pypi.org/simple/' || 'https://pypi.org/simple/' }}
        run: |
          # A new upload can take a few minutes to reach the index.
          for attempt in $(seq 1 20); do
            if python -m pip install --no-cache-dir --index-url "$INDEX_URL" "dotpromptz==${VERSION}"; then
              exit 0
            fi
            echo "dotpromptz ${VERSION} not installable yet (attempt ${attempt}/20)"
            sleep 30
          done
          echo "::error::dotpromptz ${VERSION} never became installable from ${INDEX_URL}"
          exit 1

      - name: Import and render
        run: |
          python - <<'PY'
          import asyncio
          from dotpromptz import Dotprompt
          try:
              from dotpromptz import DataArgument
          except ImportError:
              from dotpromptz.typing import DataArgument

          res = asyncio.run(
              Dotprompt().render('Hi {{name}}', DataArgument(input={'name': 'Ada'}))
          )
          text = res.messages[0].content[0].text
          assert text == 'Hi Ada', res
          print(text)
          PY
