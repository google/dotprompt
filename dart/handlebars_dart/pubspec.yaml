name: handlebars_dart
description: A pure Dart implementation of Handlebars template engine.
version: 1.0.0
license: Apache-2.0
repository: https://github.com/google/dotprompt
homepage: https://github.com/google/dotprompt/tree/main/dart/handlebars_dart

environment:
  sdk: ^3.7.0

dev_dependencies:
  # ANTLR4 runtime is only used by the parser-parity tests under test/antlr/,
  # not by the published library, so it is a dev-only dependency.
  antlr4: ^4.13.2
  lints: ^5.0.0
  test: ^1.25.0
