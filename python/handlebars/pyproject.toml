[project]
authors = [{ name = "Google" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup",
]
description = "A pure Python implementation of the Handlebars template engine."
license = "Apache-2.0"
name = "dotpromptz-handlebars"
readme = "README.md"
requires-python = ">=3.10"
version = "1.0.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
# handlebarrz is the import name already-published dotpromptz 0.1.x uses. Those
# releases install the newest dotpromptz-handlebars, so it ships for all of 1.x.
packages = ["dotpromptz_handlebars", "handlebarrz"]

[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["tests"]
